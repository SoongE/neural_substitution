session_name: cifar100
windows:
  - window_name: window
    layout: tiled
    panes:
      - shell_command:
          - CUDA_VISIBLE_DEVICES=0,1,2,3 torchrun --nproc-per-node 4 --master-port 11421 main.py --config-name=sub_cifar gpus='[4,5,6,7]' wandb=True model.model_name=resnet50_HybV11 train.batch_size=64 train.optimizer.grad_accumulation=8
          - CUDA_VISIBLE_DEVICES=0,1,2,3 torchrun --nproc-per-node 4 --master-port 11421 main.py --config-name=sub_cifar gpus='[4,5,6,7]' wandb=True model.model_name=resnet50_HybV44 train.batch_size=64 train.optimizer.grad_accumulation=8
          - CUDA_VISIBLE_DEVICES=0,1,2,3 torchrun --nproc-per-node 4 --master-port 11421 main.py --config-name=sub_cifar gpus='[4,5,6,7]' wandb=True model.model_name=resnet50_StemV1 train.batch_size=64 train.optimizer.grad_accumulation=8
          - CUDA_VISIBLE_DEVICES=0,1,2,3 torchrun --nproc-per-node 4 --master-port 11421 main.py --config-name=sub_cifar gpus='[4,5,6,7]' wandb=True model.model_name=resnet50_StemV4 train.batch_size=64 train.optimizer.grad_accumulation=8
      - shell_command:
          - CUDA_VISIBLE_DEVICES=4,5,6,7 torchrun --nproc-per-node 4 --master-port 11422 main.py --config-name=sub_cifar gpus='[4,5,6,7]' wandb=True model.model_name=resnet50_StemV4 train.batch_size=64 train.optimizer.grad_accumulation=8
          - CUDA_VISIBLE_DEVICES=4,5,6,7 torchrun --nproc-per-node 4 --master-port 11422 main.py --config-name=sub_cifar gpus='[4,5,6,7]' wandb=True model.model_name=resnet50_StemV1 train.batch_size=64 train.optimizer.grad_accumulation=8
          - CUDA_VISIBLE_DEVICES=4,5,6,7 torchrun --nproc-per-node 4 --master-port 11422 main.py --config-name=sub_cifar gpus='[4,5,6,7]' wandb=True model.model_name=resnet50_HybV11 train.batch_size=64 train.optimizer.grad_accumulation=8
          - CUDA_VISIBLE_DEVICES=4,5,6,7 torchrun --nproc-per-node 4 --master-port 11422 main.py --config-name=sub_cifar gpus='[4,5,6,7]' wandb=True model.model_name=resnet50_HybV44 train.batch_size=64 train.optimizer.grad_accumulation=8
