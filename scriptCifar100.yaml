session_name: xcifar
windows:
  - window_name: window
    layout: tiled
    panes:
      - CUDA_VISIBLE_DEVICES=5 python main.py --config-name=sub_cifar wandb=True info.project=NS_CIFAR100_V2 model.model_name=resnet18_StemV7C train.batch_size=256 train.optimizer.grad_accumulation=8 model.neural_drop_rate=0.15 name=resnet18_StemV7C_ND15_StemC
      - CUDA_VISIBLE_DEVICES=6 python main.py --config-name=sub_cifar wandb=True info.project=NS_CIFAR100_V2 model.model_name=resnet34_StemV7C train.batch_size=256 train.optimizer.grad_accumulation=8 model.neural_drop_rate=0.15 name=resnet34_StemV7C_ND15_StemC
      - CUDA_VISIBLE_DEVICES=7 python main.py --config-name=sub_cifar wandb=True info.project=NS_CIFAR100_V2 model.model_name=resnet50_StemV7C train.batch_size=128 train.optimizer.grad_accumulation=16 model.neural_drop_rate=0.15 name=resnet50_StemV7C_ND15_StemC
      - sleep 5; CUDA_VISIBLE_DEVICES=2 python main.py --config-name=sub_cifar wandb=True info.project=NS_CIFAR100_V2 model.model_name=resnet18_StemV7C train.batch_size=256 train.optimizer.grad_accumulation=8 model.neural_drop_rate=0.15 name=resnet18_StemV7C_ND15_StemC
      - sleep 5; CUDA_VISIBLE_DEVICES=3 python main.py --config-name=sub_cifar wandb=True info.project=NS_CIFAR100_V2 model.model_name=resnet34_StemV7C train.batch_size=256 train.optimizer.grad_accumulation=8 model.neural_drop_rate=0.15 name=resnet34_StemV7C_ND15_StemC
      - sleep 5; CUDA_VISIBLE_DEVICES=4 python main.py --config-name=sub_cifar wandb=True info.project=NS_CIFAR100_V2 model.model_name=resnet50_StemV7C train.batch_size=128 train.optimizer.grad_accumulation=16 model.neural_drop_rate=0.15 name=resnet50_StemV7C_ND15_StemC
