session_name: cifar100
windows:
  - window_name: window
    layout: tiled
    panes:
      - python main.py -m --config-name=sub_cifar2 gpus=[0] wandb=True model.model_name=resnet18_SubInceptionV1
      - python main.py -m --config-name=sub_cifar2 gpus=[1] wandb=True model.model_name=resnet50,resnet50_SubInceptionV1,resnet50_SubInceptionV2,resnet50_SubInceptionV3,resnet50_AddInceptionV1,resnet50_AddInceptionV2,resnet50_AddInceptionV3
      - python main.py -m --config-name=sub_cifar2 gpus=[2] wandb=True model.model_name=resnext50,resnext50_SubInceptionV1,resnext50_SubInceptionV2,resnext50_SubInceptionV3,resnext50_AddInceptionV1,resnext50_AddInceptionV2,resnext50_AddInceptionV3
      - python main.py -m --config-name=sub_cifar2 gpus=[3] wandb=True model.model_name=resnext50,resnext50_SubInceptionV1,resnext50_SubInceptionV2,resnext50_SubInceptionV3,resnext50_AddInceptionV1,resnext50_AddInceptionV2,resnext50_AddInceptionV3

