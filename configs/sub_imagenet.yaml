defaults:
  - config
  - override train/optimizer: lamb
  - _self_

gpus: [ 0,1,2,3 ]
name: ${model.model_name}

info:
  project: Neural_Substitution_ImageNet

train:
  epochs: 100
  batch_size: 128
  num_workers: 8
  bce_loss: True
  target_thresh: 0.2

  lr_scheduler:
    warmup_epochs: 3
    warmup_lr: 1e-4

  optimizer:
    grad_accumulation: 2

model:
  model_name:
  drop_path_rate: 0.05
  neural_drop_rate: 0.1

dataset:
  augmentation:
    mixup: 0.1
    cumix: 1.0
    crop_pct: 0.95
    aa: rand-m7-mstd0.5-inc1
    aug_repeat: 0
    smoothing: 0.0