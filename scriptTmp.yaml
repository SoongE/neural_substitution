    layout: tiled
    panes:
      - shell_command:
        - CUDA_VISIBLE_DEVICES=0 python main.py --config-name=sub_cifar3 wandb=True model.model_name=resnet18_StemV1C name=resnet18_StemV1C_ND model.drop_path_rate=0. model.neural_drop_rate=0.0001 train.lr_scheduler.min_lr=1e-4
        - CUDA_VISIBLE_DEVICES=0 python main.py --config-name=sub_cifar3 wandb=True model.model_name=resnet18_StemV1C name=resnet18_StemV1C_ND model.drop_path_rate=0. model.neural_drop_rate=0.0001 train.lr_scheduler.min_lr=1e-4
